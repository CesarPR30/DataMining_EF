<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Final de Data Mining</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Teoría, ejercicios resueltos, práctica con autograder y simulacro del examen final de Data Mining.">
<meta name="theme-color" content="#ffffff" id="themeColor">
<script>
  // Tema claro por defecto; el usuario puede cambiar a oscuro con el botón del encabezado.
  (function () {
    var t = 'light';
    try { var s = localStorage.getItem('dmfinal:theme'); if (s) t = JSON.parse(s); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DM Final">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior con 5 vistas; vistas de estudio con índice lateral de temas + columna de lectura.
   Motivo: nodos, aristas y matrices; el acento cobalto marca lo interactivo, el ámbar lo destacado. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #eef1f8; --ink: #151b2d; --muted: #5b6482; --line: #d9deeb;
  --accent: #2350c4; --accent-ink: #ffffff; --accent-soft: #e5ebfb; --amber: #b86e00; --amber-soft: #fbefd9;
  --ok: #19804a; --ok-soft: #e2f4ea; --bad: #be3434; --bad-soft: #fbe6e6;
  --c1: #3563d6; --c2: #e08a24; --c3: #2b9a66; --c4: #c8457d; --c5: #7a5bc9; --c6: #2a95a8;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 10px; --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 16px rgba(20, 30, 60, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d111b; --surface: #151b29; --surface-2: #1b2234; --ink: #e6e9f3; --muted: #97a0ba; --line: #2a3349;
    --accent: #7d9bff; --accent-ink: #0d111b; --accent-soft: #1d2747; --amber: #e8a640; --amber-soft: #33270f;
    --ok: #4fc285; --ok-soft: #13301f; --bad: #f07272; --bad-soft: #3a1717;
    --c1: #5b84f0; --c2: #e99b3c; --c3: #3fb37d; --c4: #db5f93; --c5: #9478e0; --c6: #3fb0c4;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d111b; --surface: #151b29; --surface-2: #1b2234; --ink: #e6e9f3; --muted: #97a0ba; --line: #2a3349;
  --accent: #7d9bff; --accent-ink: #0d111b; --accent-soft: #1d2747; --amber: #e8a640; --amber-soft: #33270f;
  --ok: #4fc285; --ok-soft: #13301f; --bad: #f07272; --bad-soft: #3a1717;
  --c1: #5b84f0; --c2: #e99b3c; --c3: #3fb37d; --c4: #db5f93; --c5: #9478e0; --c6: #3fb0c4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
}
* { box-sizing: border-box; }
:root { color-scheme: light; }
[hidden] { display: none !important; }
img, svg { max-width: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
:root { padding-bottom: env(safe-area-inset-bottom, 0px); }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15.5px; line-height: 1.6; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: .86em; } .mono { font-family: var(--f-mono); font-size: .9em; }
.okc { color: var(--ok); } .badc { color: var(--bad); }
.eyebrow { text-transform: uppercase; letter-spacing: .1em; font-size: .74rem; font-weight: 600; color: var(--accent); margin: 0 0 .3rem; }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; padding-block: .55rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: .55rem; font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand svg { flex: none; }
.tabs { display: flex; gap: .2rem; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: .45rem .8rem; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .92rem; white-space: nowrap; }
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab.on { color: var(--accent); background: var(--accent-soft); }
.show-sm { display: none; }
.tab .num { font-family: var(--f-mono); font-size: .72rem; opacity: .7; margin-right: .3rem; }

.theme-btn { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.theme-btn:hover { border-color: var(--accent); color: var(--accent); }
.theme-btn .ic-sun { display: none; }
:root[data-theme="dark"] .theme-btn .ic-sun { display: block; }
:root[data-theme="dark"] .theme-btn .ic-moon { display: none; }

/* ---------- simulador de notas ---------- */
.grades { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 1.4rem; align-items: start; }
.g-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.1rem 1.2rem; }
.g-group { margin-bottom: 1.1rem; }
.g-group:last-child { margin-bottom: 0; }
.g-gh { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; background: var(--surface-2); border-radius: 8px; padding: .45rem .7rem; font-weight: 700; }
.g-gh span:last-child { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); font-weight: 600; }
.g-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .35rem 1rem; align-items: center; padding: .7rem .2rem; border-bottom: 1px solid var(--line); }
.g-row:last-child { border-bottom: 0; }
.g-name { font-weight: 600; }
.g-meta { font-size: .8rem; color: var(--muted); }
.g-in { display: flex; align-items: center; gap: .5rem; }
.g-in input[type=number] { width: 4.6rem; font: 600 1rem var(--f-mono); padding: .35rem .5rem; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); text-align: right; }
.g-in input[type=number]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.g-contrib { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); min-width: 4.2rem; text-align: right; }
.g-range { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
.g-range.pending { opacity: .35; filter: grayscale(1); }
.g-chip { font-size: .72rem; }
.g-res { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: 1rem; }
.g-final { display: flex; align-items: baseline; gap: .5rem; }
.g-final b { font-family: var(--f-display); font-size: 3.4rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.g-final small { color: var(--muted); font-size: 1rem; }
.g-status { display: inline-block; font-weight: 700; font-size: .85rem; padding: .2rem .6rem; border-radius: 99px; }
.g-status.ok { background: var(--ok-soft); color: var(--ok); } .g-status.bad { background: var(--bad-soft); color: var(--bad); } .g-status.mid { background: var(--amber-soft); color: var(--amber); }
.g-stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.g-stack span { height: 100%; }
.g-legend { display: flex; flex-wrap: wrap; gap: .3rem .8rem; font-size: .78rem; color: var(--muted); }
.g-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: .3rem; vertical-align: middle; }
.g-kv { display: flex; justify-content: space-between; gap: 1rem; padding: .3rem 0; border-bottom: 1px dashed var(--line); }
.g-kv:last-child { border-bottom: 0; }
.g-kv b { font-family: var(--f-mono); }
.g-need { background: var(--accent-soft); border-radius: 10px; padding: .8rem .9rem; }
.g-need p { margin: .2rem 0; }
.g-need .big { font-family: var(--f-display); font-size: 1.8rem; font-weight: 700; color: var(--accent); }
.g-target { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; font-size: .9rem; }
.g-target input { width: 4.2rem; font: 600 .95rem var(--f-mono); padding: .3rem .45rem; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.g-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
@media (max-width: 900px) { .grades { grid-template-columns: 1fr; } .g-res { position: static; } }

#view { max-width: 1180px; margin: 0 auto; padding-block: 1.6rem 4rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- botones ---------- */
.btn { display: inline-flex; align-items: center; gap: .4rem; font: 600 .92rem var(--f-body); padding: .55rem 1rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.small { padding: .32rem .7rem; font-size: .84rem; }
.btn:disabled { opacity: .55; cursor: default; }
.lnk { font-weight: 600; text-decoration: none; white-space: nowrap; }
.pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: .12rem .5rem; border-radius: 99px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.pill.hit { background: var(--amber-soft); color: var(--amber); border-color: transparent; }

/* ---------- inicio ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 2rem; align-items: center; padding-block: 1rem 2rem; }
.hero h1 { font-size: clamp(1.9rem, 4.2vw, 3rem); font-weight: 700; margin-bottom: .8rem; }
.hero .lead { font-size: 1.08rem; color: var(--muted); max-width: 60ch; margin: 0 0 1.3rem; }
.hero-cta { display: flex; gap: .6rem; flex-wrap: wrap; }
.hero-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.3rem; box-shadow: var(--shadow); display: grid; gap: .55rem; }
.hc-row { display: flex; justify-content: space-between; gap: 1rem; font-weight: 600; }
.hc-v { font-family: var(--f-mono); font-size: .92rem; }
.hc-bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.hc-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.hc-bar.alt span { background: var(--amber); }
.hc-note { margin: .4rem 0 0; font-size: .86rem; color: var(--muted); }
.block { margin-top: 2.4rem; }
.block > h2 { font-size: 1.5rem; margin-bottom: 1rem; }
.cards3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem 1.2rem; }
.card h3 { font-size: 1.08rem; margin-bottom: .5rem; }
.card p { margin: 0 0 .5rem; }
.plan { padding-left: 1.3rem; display: grid; gap: .45rem; max-width: 75ch; }
.progress { margin-top: 1.2rem; max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .9rem 1rem; display: grid; gap: .5rem; }
.pr-top { display: flex; justify-content: space-between; gap: 1rem; font-size: .92rem; }

/* ---------- tablas ---------- */
.tbl-wrap { overflow-x: auto; margin: .7rem 0; max-width: 100%; }
table.mtx { border-collapse: collapse; font-size: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-variant-numeric: tabular-nums; }
.mtx th, .mtx td { padding: .38rem .7rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.mtx thead th { background: var(--surface-2); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
.mtx tbody th { font-weight: 600; }
.mtx tr:last-child > * { border-bottom: 0; }
.cov td, .cov th { min-width: 110px; }

/* ---------- layout con índice ---------- */
.split { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 2rem; align-items: start; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); display: grid; gap: .25rem; }
.side-h { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 0 0 .3rem .6rem; }
.side-btn { text-align: left; background: none; border: 0; border-radius: 8px; padding: .5rem .7rem; cursor: pointer; color: var(--ink); font: 600 .94rem var(--f-body); display: grid; }
.side-btn small { color: var(--muted); font-weight: 400; font-size: .76rem; }
.side-btn:hover { background: var(--surface-2); }
.side-btn.on { background: var(--accent-soft); color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.main-col { min-width: 0; }
.col-h { margin-bottom: 1.2rem; } .col-h h2 { font-size: 1.6rem; margin-bottom: .3rem; } .col-h p { margin: 0; max-width: 70ch; }

/* ---------- prosa teórica ---------- */
.prose { max-width: 78ch; }
.prose h2 { font-size: 1.75rem; margin-bottom: .6rem; }
.prose h3 { font-size: 1.22rem; margin: 2rem 0 .6rem; padding-top: .9rem; border-top: 1px solid var(--line); }
.prose h4 { font-size: 1.02rem; margin: 1.3rem 0 .4rem; }
.prose p, .prose ul, .prose ol { margin: .5rem 0; }
.prose li { margin: .25rem 0; }
.prose .lead { font-size: 1.05rem; color: var(--muted); }
.fx { font-family: var(--f-mono); font-size: .86rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: .6rem .85rem; margin: .6rem 0; overflow-x: auto; line-height: 1.75; }
.callout { background: var(--accent-soft); border-radius: 8px; padding: .75rem 1rem; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .9rem; margin: .7rem 0; }
.grid2 > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .7rem .9rem; }
.grid2 .pro { border-top: 3px solid var(--ok); } .grid2 .con { border-top: 3px solid var(--bad); }
.grid2 ul { padding-left: 1.1rem; margin: .3rem 0 0; } .grid2 p { margin: .3rem 0 0; }

/* ---------- quiz ---------- */
.quiz { margin-top: 2.5rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.2rem 1.3rem; max-width: 78ch; }
.quiz h3 { font-size: 1.2rem; } .quiz > p { margin: .2rem 0 1rem; }
.qz-item { padding: .8rem 0; border-top: 1px solid var(--line); }
.qz-q { margin: 0 0 .5rem; }
.qz-opts { display: grid; gap: .35rem; }
.qz-opt { text-align: left; font: 500 .93rem var(--f-body); padding: .5rem .75rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.qz-opt:hover:not(:disabled) { border-color: var(--accent); }
.qz-opt.ok { background: var(--ok-soft); border-color: var(--ok); } .qz-opt.bad { background: var(--bad-soft); border-color: var(--bad); }
.qz-opt:disabled { cursor: default; }
.qz-exp { margin: .5rem 0 0; font-size: .92rem; }
.quiz-score { font-weight: 600; margin: .6rem 0 0; }
.next-box { margin-top: 1.5rem; max-width: 78ch; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; padding: .9rem 1rem; border: 1px dashed var(--line); border-radius: 10px; }

/* ---------- cómo resolver ---------- */
.toc, .chips { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.2rem; }
.chip { font: 600 .84rem var(--f-body); padding: .35rem .75rem; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
.chip:hover { border-color: var(--accent); } .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.rx { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.2rem 1.3rem; margin-bottom: 1.4rem; scroll-margin-top: 80px; }
.rx-h { display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; margin-bottom: .8rem; }
.rx-h h3 { font-size: 1.2rem; }
.rx-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem; }
.rx-k { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; margin: 0 0 .35rem; }
.rx-steps, .rx-traps { margin: 0; padding-left: 1.2rem; display: grid; gap: .3rem; font-size: .94rem; }
.rx-traps li::marker { color: var(--amber); }
.rx-ex { margin-top: 1.1rem; border-top: 1px solid var(--line); padding-top: 1rem; }
.rx-exh { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.ex-ans { margin: .8rem 0; }
.ex-chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.ex-chip { display: inline-flex; gap: .45rem; align-items: baseline; font-size: .84rem; background: var(--surface-2); border-radius: 6px; padding: .25rem .55rem; }
.ex-chip b { font-family: var(--f-mono); color: var(--accent); }
.sec-gap { margin: 2.5rem 0 .4rem; font-size: 1.5rem; }
.case-d { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: .6rem 0; max-width: 85ch; }
.case-d summary { cursor: pointer; padding: .8rem 1rem; font-weight: 600; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.case-body { padding: 0 1.1rem 1rem; }
.case-prompt { background: var(--surface-2); padding: .7rem .9rem; border-radius: 8px; }
.model p, .model ol, .model ul { margin: .45rem 0; }
.rubric-list { margin: 0; padding-left: 1.2rem; }

/* ---------- problemas ---------- */
.statement p { margin: .5rem 0; }
.conv { font-size: .88rem; color: var(--muted); border-left: 3px solid var(--amber); padding-left: .7rem; }
.graph { width: 100%; max-width: 560px; height: auto; display: block; margin: .6rem 0; }
.graph line, .graph path { stroke: var(--ink); }
.g-lbl { font: 600 13px var(--f-mono); fill: var(--ink); }
.g-lbl-inv { font: 600 12px var(--f-mono); fill: #ffffff; }
.g-w { font: 600 11px var(--f-mono); fill: var(--ink); }
.g-tag { font: 500 11px var(--f-mono); fill: var(--muted); }
.answers { margin-top: 1rem; }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .55rem .9rem; }
.ans-row { display: grid; gap: .2rem; background: var(--surface-2); padding: .5rem .65rem; border-radius: 8px; min-width: 0; }
.ans-row.wide { grid-column: 1 / -1; }
.ans-lbl { font-size: .82rem; color: var(--muted); font-weight: 600; }
.ans-box { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
.ans-in { font: 500 .95rem var(--f-mono); width: 9.5rem; max-width: 100%; padding: .38rem .55rem; border-radius: 6px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
.ans-in.ans-text { width: 100%; max-width: 22rem; }
.ans-in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.ans-in.is-ok { border-color: var(--ok); background: var(--ok-soft); } .ans-in.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.ans-mark { font-weight: 700; font-size: .95rem; display: inline-flex; gap: .4rem; align-items: center; }
.ans-mark.ok { color: var(--ok); } .ans-mark.bad { color: var(--bad); }
.expect { font: 600 .8rem var(--f-mono); color: var(--ink); background: var(--amber-soft); padding: .1rem .4rem; border-radius: 4px; }

.cellin { display: flex; align-items: center; gap: .3rem; flex-wrap: wrap; }

.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .7rem; }

.timer span { font-size: 1.4rem; font-weight: 600; } .timer small { color: var(--muted); font-size: .72rem; }

.case-ta:focus { border-color: var(--accent); outline: none; }
.case-rev { margin-top: 1rem; border-top: 2px solid var(--accent); padding-top: .9rem; }
.rubric { margin-top: 1rem; background: var(--surface-2); border-radius: 8px; padding: .8rem 1rem; }
.rb { display: flex; gap: .55rem; align-items: baseline; padding: .3rem 0; cursor: pointer; }
.rb span { flex: 1; } .rb b { font-family: var(--f-mono); font-size: .85rem; color: var(--accent); }

.exam-submit { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 1.4rem; }
.result { margin-top: 1.4rem; display: flex; gap: 1.6rem; align-items: center; flex-wrap: wrap; background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 1.2rem 1.4rem; }
.res-big span { font-family: var(--f-display); font-size: 3rem; font-weight: 700; color: var(--accent); } .res-big small { font-size: 1.1rem; color: var(--muted); }
.res-rows { display: grid; gap: .3rem; flex: 1; min-width: 220px; } .res-rows > div { display: flex; justify-content: space-between; gap: 1rem; }

/* ---------- videos ---------- */
.vid { max-width: 78ch; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 1.8rem; box-shadow: var(--shadow); }
